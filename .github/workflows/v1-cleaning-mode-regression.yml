name: V1 cleaning mode regression

on:
  push:
    branches:
      - fix/v1-water-slide-smartplan-readback
  pull_request:
    paths:
      - 'roborock/data/v1/v1_clean_modes.py'
      - 'roborock/devices/traits/v1/status.py'
      - 'tests/devices/traits/v1/test_status.py'
      - '.github/workflows/v1-cleaning-mode-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install project and test dependencies
        run: uv sync --group dev --python 3.13
      - name: Run V1 StatusTrait tests
        run: uv run --python 3.13 pytest -q tests/devices/traits/v1/test_status.py
      - name: Ruff on changed files
        run: uv run --python 3.13 ruff check roborock/data/v1/v1_clean_modes.py roborock/devices/traits/v1/status.py tests/devices/traits/v1/test_status.py
